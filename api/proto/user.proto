syntax = "proto3";

package user;

option go_package = "github.com/arjunjgowda/rate-limitting/internal/api/grpc/pb";

service UserService {
    rpc Login (LoginRequest) returns (LoginResponse) {}
}

message LoginRequest {
    string username = 1;
    string password = 2;
}

message LoginResponse {
    string id = 1;
    string username = 2;
    string token = 3; // Placeholder for future auth
}
