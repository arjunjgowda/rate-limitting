openapi: 3.0.0
info:
  title: Rate Limiting System API
  description: A production-grade rate-limiting system with dual REST and gRPC support.
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local Development Server
paths:
  /login:
    post:
      summary: User Login
      responses:
        '200':
          description: Success
        '429':
          description: Rate Limit Exceeded
  /check-balance:
    get:
      summary: Check Balance
      responses:
        '200':
          description: Success
        '429':
          description: Rate Limit Exceeded
  /user:
    post:
      summary: Create User
      responses:
        '201':
          description: Created
        '429':
          description: Rate Limit Exceeded
  /user/{id}:
    get:
      summary: Get User Info
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
        '429':
          description: Rate Limit Exceeded
