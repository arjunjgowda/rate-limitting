openapi: 3.0.0
info:
  title: Rate Limiting System API
  description: A production-grade rate-limiting system with dual REST and gRPC support.
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local Development Server

paths:
  /login:
    post:
      summary: User Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
                description: Authentication token
        '401':
          description: Unauthorized
        '429':
          description: Rate Limit Exceeded

  /check-balance:
    get:
      summary: Check Balance
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: number
                format: double
        '404':
          description: User Not Found
        '429':
          description: Rate Limit Exceeded

  /user:
    post:
      summary: Create User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: string
                description: Created User ID
        '400':
          description: Invalid Input
        '429':
          description: Rate Limit Exceeded

  /user/{id}:
    get:
      summary: Get User Info
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User Not Found
        '429':
          description: Rate Limit Exceeded

  /transfer:
    post:
      summary: Transfer Funds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '200':
          description: Transfer Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
        '400':
          description: Invalid Transfer Parameters
        '429':
          description: Rate Limit Exceeded

components:
  schemas:
    User:
      type: object
      required:
        - username
        - email
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          minLength: 5
        password:
          type: string
          writeOnly: true
        balance:
          type: number
          format: double
        email:
          type: string
          format: email

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    TransferRequest:
      type: object
      required:
        - fromId
        - toId
        - amount
      properties:
        fromId:
          type: string
          format: uuid
        toId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
          minimum: 0.01

